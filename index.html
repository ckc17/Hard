<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Our Songs ♡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
  <video id="bgVideo" class="background-video" autoplay muted loop playsinline preload="auto">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <section class="player">
    <div class="eyebrow">OUR SONGS <span>♡</span></div>
    <div class="song-info">
      <div id="songTitle" class="song-title">Loading...</div>
      <div id="songArtist" class="song-artist"></div>
    </div>
    <div class="progress-wrap">
      <span id="currentTime">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0" step="0.1">
      <span id="duration">0:00</span>
    </div>
    <div class="controls">
      <button id="prevBtn" class="control-btn small">⏮</button>
      <button id="playBtn" class="play-btn">▶</button>
      <button id="nextBtn" class="control-btn small">⏭</button>
      <button id="loopBtn" class="control-btn small" aria-pressed="false">↻</button>
    </div>
    <div class="volume-row">
      <span class="volume-icon">🔊</span>
      <input id="volume" type="range" min="0" max="1" value="0.8" step="0.01">
    </div>
    <div id="status" class="status">Tap play to start ♡</div>
  </section>
</main>
<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
